<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 知识图谱 VR 展示 - v1.3 科幻交互版</title>
    <style>
        :root {
            --primary-color: #b38600;
            --ai-color: #1a73e8;
            --bg-light: #f5f5f7;
            --panel-bg: rgba(255, 255, 255, 0.96);
        }

        body { margin: 0; overflow: hidden; background-color: #000; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
        
        #nav-bar {
            position: absolute; top: 20px; right: 20px; z-index: 500;
            display: flex; gap: 10px; background: var(--panel-bg);
            padding: 5px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            backdrop-filter: blur(10px);
        }
        .nav-btn { padding: 8px 20px; border-radius: 8px; cursor: pointer; border: none; background: transparent; font-weight: bold; color: #666; transition: all 0.3s; }
        .nav-btn.active { background: var(--primary-color); color: white; }

        #viewport-container { width: 100%; height: 100vh; }

        /* 仅用于非 VR 模式的数据管理 */
        #data-table-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100vh;
            background: white; z-index: 400; display: none; overflow-y: auto;
            padding: 80px 40px 40px 40px; box-sizing: border-box;
        }

        .section-box { background: #fafafa; border: 1px solid #eee; border-radius: 16px; padding: 25px; margin-bottom: 30px; }
        textarea { width: 100%; height: 100px; margin-top: 10px; padding: 12px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }

        .btn-action { background: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        #controls-hint { 
            position: absolute; bottom: 80px; width: 100%; text-align: center; 
            color: #fff; font-size: 14px; z-index: 10; pointer-events: none; 
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.3); padding: 10px 0;
        }
    </style>
</head>
<body>
    <div id="nav-bar">
        <button class="nav-btn active" id="btn-show-3d">3D 图谱视图</button>
        <button class="nav-btn" id="btn-show-data">数据管理</button>
    </div>

    <div id="viewport-container"></div>

    <div id="data-table-container">
        <div class="section-box">
            <h2>✨ 知识录入控制台</h2>
            <textarea id="ai-input-text" placeholder="主节点,客节点,关系..."></textarea>
            <div style="margin-top: 10px;">
                <button class="btn-action" onclick="applyBatchImport()">快速解析导入</button>
                <button class="btn-action" style="background:#eee; color:#666; margin-left:10px;" onclick="applyDataChanges()">💾 刷新 3D 图谱</button>
            </div>
        </div>
        <table id="data-table">
            <thead><tr><th>主节点</th><th>客节点</th><th>关系</th><th>操作</th></tr></thead>
            <tbody id="data-table-body"></tbody>
        </table>
    </div>

    <div id="controls-hint">左摇杆：全向飞行移动 | 右摇杆：旋转视角/垂直升降 | 扳机键：点击节点查看 3D 浮窗</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- VR 按钮逻辑 ---
        const VRButton = {
            createButton: function ( renderer ) {
                const button = document.createElement( 'button' );
                function showEnterVR() {
                    let currentSession = null;
                    async function onSessionStarted( session ) {
                        session.addEventListener( 'end', onSessionEnded );
                        await renderer.xr.setSession( session );
                        button.textContent = '退出 VR';
                        currentSession = session;
                    }
                    function onSessionEnded() {
                        currentSession.removeEventListener( 'end', onSessionEnded );
                        button.textContent = '进入 VR 模式';
                        currentSession = null;
                    }
                    button.style.display = '';
                    button.style.cursor = 'pointer';
                    button.textContent = '进入 VR 模式';
                    button.onclick = () => {
                        if ( currentSession === null ) {
                            navigator.xr.requestSession( 'immersive-vr', { optionalFeatures: [ 'local-floor', 'bounded-floor', 'hand-tracking' ] } ).then( onSessionStarted );
                        } else {
                            currentSession.end();
                        }
                    };
                }
                function stylizeElement( element ) {
                    element.style.position = 'absolute';
                    element.style.bottom = '20px';
                    element.style.left = 'calc(50% - 75px)';
                    element.style.width = '150px';
                    element.style.padding = '12px 6px';
                    element.style.border = '1px solid #fff';
                    element.style.borderRadius = '8px';
                    element.style.background = 'rgba(0,0,0,0.8)';
                    element.style.color = '#fff';
                    element.style.font = 'bold 14px sans-serif';
                    element.style.zIndex = '9999';
                }
                if ( 'xr' in navigator ) {
                    stylizeElement( button );
                    navigator.xr.isSessionSupported( 'immersive-vr' ).then( ( supported ) => {
                        if(supported) showEnterVR();
                        else button.textContent = '您的设备不支持 VR';
                    } );
                    return button;
                } else {
                    const msg = document.createElement('div');
                    msg.innerHTML = "需 HTTPS 访问以开启 VR";
                    stylizeElement(msg);
                    return msg;
                }
            }
        };

        const COLORS = { 
            person: 0xe63946, 
            org: 0xf39c12, 
            meeting: 0x2a9d8f, 
            year: 0x457b9d, 
            location: 0x9b5de5, 
            other: 0x8d99ae 
        };
        
        let currentData = [
            { source: "毛泽东", target: "1893年", relation: "出生年份" },
            { source: "毛泽东", target: "长沙市", relation: "出生地" },
            { source: "遵义会议", target: "1935年", relation: "发生年份" },
            { source: "邓小平", target: "1904年", relation: "出生年份" },
            { source: "周恩来", target: "1898年", relation: "出生年份" }
        ];

        let scene, camera, renderer, controls, raycaster;
        let graphGroup, worldRig, uiGroup;
        let interactableObjects = []; 
        let edgeObjects = [];
        let infoPanel; // 3D 浮窗面板
        
        // VR 导航参数
        const moveSpeed = 0.2;
        const rotateSpeed = 0.04;
        const liftSpeed = 0.15;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            // 玩家底座
            worldRig = new THREE.Group();
            scene.add(worldRig);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.set(0, 1.6, 50); 
            worldRig.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true;
            renderer.xr.setReferenceSpaceType('local');
            
            document.getElementById('viewport-container').appendChild(renderer.domElement);
            document.body.appendChild(VRButton.createButton(renderer));
            
            raycaster = new THREE.Raycaster();
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // 图谱容器
            graphGroup = new THREE.Group();
            scene.add(graphGroup);

            // UI 容器（始终相对于玩家显示）
            uiGroup = new THREE.Group();
            scene.add(uiGroup);

            initVRControllers();
            updateGraphFromData();
            initUI();
            create3DInfoPanel(); // 初始化 3D 浮窗

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const pointLight = new THREE.PointLight(0xffffff, 1.2);
            pointLight.position.set(20, 100, 50);
            scene.add(pointLight);

            // 星空背景
            const starGeo = new THREE.BufferGeometry();
            const starPos = [];
            for(let i=0; i<8000; i++) {
                starPos.push((Math.random()-0.5)*2000, (Math.random()-0.5)*2000, (Math.random()-0.5)*2000);
            }
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
            scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 0.8})));

            renderer.setAnimationLoop(renderLoop);
        }

        function initVRControllers() {
            function onSelectStart() {
                const tempMatrix = new THREE.Matrix4();
                tempMatrix.identity().extractRotation(this.matrixWorld);
                raycaster.ray.origin.setFromMatrixPosition(this.matrixWorld);
                raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

                const intersects = raycaster.intersectObjects(interactableObjects);
                if (intersects.length > 0) {
                    showDetail3D(intersects[0].object.userData.name);
                }
            }

            const c1 = renderer.xr.getController(0);
            c1.addEventListener('selectstart', onSelectStart);
            scene.add(c1);

            const c2 = renderer.xr.getController(1);
            c2.addEventListener('selectstart', onSelectStart);
            scene.add(c2);

            const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-10)]);
            const laserMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6 });
            const laser = new THREE.Line(laserGeo, laserMat);
            c1.add(laser.clone());
            c2.add(laser.clone());
        }

        // --- 核心更新逻辑：白色粗关系线 ---
        function updateGraphFromData() {
            while(graphGroup.children.length > 0) graphGroup.remove(graphGroup.children[0]);
            interactableObjects = [];
            edgeObjects = [];
            
            const nodesSet = new Set();
            currentData.forEach(d => { nodesSet.add(d.source); nodesSet.add(d.target); });
            const nodesArray = Array.from(nodesSet);
            const n = nodesArray.length;
            const radius = Math.max(20, Math.sqrt(n) * 6); 
            
            const nodeLookup = {};
            nodesArray.forEach((name, i) => {
                const phi = Math.acos(-1 + (2 * i) / n);
                const theta = Math.sqrt(n * Math.PI) * phi;
                const pos = new THREE.Vector3(
                    radius * Math.cos(theta) * Math.sin(phi),
                    radius * Math.sin(theta) * Math.sin(phi),
                    radius * Math.cos(phi)
                );
                nodeLookup[name] = createNode3D(name, pos);
            });

            currentData.forEach(rel => {
                if (nodeLookup[rel.source] && nodeLookup[rel.target]) {
                    createEdge3D(nodeLookup[rel.source], nodeLookup[rel.target]);
                }
            });
        }

        function createNode3D(name, pos) {
            const category = /\d+年/.test(name) ? "year" : (/会议|大会|战役/.test(name) ? "meeting" : (name.length <= 3 ? "person" : "other"));
            const sphere = new THREE.Mesh(
                new THREE.SphereGeometry(category === "person" ? 1.2 : 0.8, 24, 24),
                new THREE.MeshPhongMaterial({ 
                    color: COLORS[category], 
                    emissive: COLORS[category], 
                    emissiveIntensity: 0.4,
                    shininess: 100 
                })
            );
            sphere.position.copy(pos);
            sphere.userData = { name, category };

            // 显著加大的文本标签
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512; canvas.height = 128;
            ctx.font = 'Bold 65px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff';
            ctx.shadowColor = "rgba(0,0,0,1)"; ctx.shadowBlur = 10;
            ctx.fillText(name, 256, 80);
            
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false }));
            sprite.position.set(0, 2.5, 0);
            sprite.scale.set(10, 2.5, 1);
            sphere.add(sprite);

            graphGroup.add(sphere);
            interactableObjects.push(sphere);
            return sphere;
        }

        function createEdge3D(startNode, endNode) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(6); 
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            // 白色高亮关系线
            const material = new THREE.LineBasicMaterial({ 
                color: 0xffffff, 
                transparent: true, 
                opacity: 0.8,
                linewidth: 2 // 注意：现代浏览器底层常忽略 linewidth，故配合白色增强显示
            });
            const line = new THREE.Line(geometry, material);
            
            graphGroup.add(line);
            edgeObjects.push({ line, startNode, endNode });
        }

        // --- 3D 浮窗创建逻辑 ---
        function create3DInfoPanel() {
            const panelGeo = new THREE.PlaneGeometry(8, 6);
            const panelMat = new THREE.MeshBasicMaterial({ 
                color: 0x001a33, 
                transparent: true, 
                opacity: 0.85, 
                side: THREE.DoubleSide 
            });
            infoPanel = new THREE.Mesh(panelGeo, panelMat);
            infoPanel.visible = false;
            
            // 装饰边框
            const borderGeo = new THREE.EdgesGeometry(panelGeo);
            const borderMat = new THREE.LineBasicMaterial({ color: 0xb38600, linewidth: 2 });
            const border = new THREE.LineSegments(borderGeo, borderMat);
            infoPanel.add(border);

            scene.add(infoPanel);
        }

        function showDetail3D(name) {
            const nodeData = currentData.filter(d => d.source === name || d.target === name);
            const category = interactableObjects.find(o => o.userData.name === name).userData.category;
            const catMap = { person: "人物", org: "组织", meeting: "事件", year: "年份", location: "地点", other: "其他" };

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1024; canvas.height = 768;
            
            // 绘制科幻背景风格
            ctx.fillStyle = "rgba(0, 30, 60, 0.9)";
            ctx.fillRect(0, 0, 1024, 768);
            
            // 绘制标题
            ctx.fillStyle = "#ffcc00";
            ctx.font = "Bold 80px Microsoft YaHei";
            ctx.fillText(name, 50, 120);
            
            // 绘制分类
            ctx.fillStyle = "#ffffff";
            ctx.font = "40px Microsoft YaHei";
            ctx.fillText(`分类: ${catMap[category]}`, 50, 200);
            
            // 绘制关联
            ctx.fillStyle = "#00ddee";
            ctx.font = "Bold 45px Microsoft YaHei";
            ctx.fillText("知识图谱关联路径:", 50, 300);
            
            ctx.fillStyle = "#ffffff";
            ctx.font = "38px Microsoft YaHei";
            nodeData.slice(0, 8).forEach((rel, i) => {
                const text = `${rel.relation} -> ${rel.source === name ? rel.target : rel.source}`;
                ctx.fillText(`· ${text}`, 70, 370 + i * 50);
            });

            const texture = new THREE.CanvasTexture(canvas);
            infoPanel.material.map = texture;
            infoPanel.material.needsUpdate = true;

            // 将面板放置在玩家正前方 15 个单位处
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            infoPanel.position.copy(camera.getWorldPosition(new THREE.Vector3())).add(dir.multiplyScalar(15));
            infoPanel.lookAt(camera.position);
            infoPanel.visible = true;

            // 5秒后自动关闭，或者点击其他处关闭
            setTimeout(() => { if(infoPanel.visible) infoPanel.visible = false; }, 15000);
        }

        // --- 渲染循环与高度导航逻辑 ---
        function renderLoop() {
            const session = renderer.xr.getSession();
            
            if (session) {
                for (const source of session.inputSources) {
                    if (source.gamepad && source.gamepad.axes) {
                        const axes = source.gamepad.axes;
                        
                        // 左摇杆：全向飞行 (看向哪里就往哪里飞，包含上下)
                        if (source.handedness === 'left') {
                            const lookDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                            const sideDir = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                            
                            // 前后左右移动
                            worldRig.position.addScaledVector(lookDir, -axes[3] * moveSpeed);
                            worldRig.position.addScaledVector(sideDir, axes[2] * moveSpeed);
                        }
                        
                        // 右摇杆：视角旋转 + 强制垂直升降
                        if (source.handedness === 'right') {
                            // 左右控制水平旋转
                            worldRig.rotation.y -= axes[2] * rotateSpeed;
                            // 上下控制强制高度升降 (Y轴)
                            worldRig.position.y -= axes[3] * liftSpeed;
                        }
                    }
                }
            } else {
                controls.update();
            }

            // 实时更新连线
            edgeObjects.forEach(edge => {
                const posAttr = edge.line.geometry.attributes.position;
                posAttr.array[0] = edge.startNode.position.x;
                posAttr.array[1] = edge.startNode.position.y;
                posAttr.array[2] = edge.startNode.position.z;
                posAttr.array[3] = edge.endNode.position.x;
                posAttr.array[4] = edge.endNode.position.y;
                posAttr.array[5] = edge.endNode.position.z;
                posAttr.needsUpdate = true;
                edge.line.geometry.computeBoundingSphere();
            });

            renderer.render(scene, camera);
        }

        // --- UI 及 工具函数 ---
        function initUI() {
            document.getElementById('btn-show-3d').onclick = () => {
                document.getElementById('viewport-container').style.display = 'block';
                document.getElementById('data-table-container').style.display = 'none';
            };
            document.getElementById('btn-show-data').onclick = () => {
                document.getElementById('viewport-container').style.display = 'none';
                document.getElementById('data-table-container').style.display = 'block';
                renderDataTable();
            };
        }

        function applyBatchImport() {
            const text = document.getElementById('ai-input-text').value.trim();
            if(!text) return;
            text.split('\n').forEach(line => {
                const p = line.split(',');
                if (p.length >= 3) currentData.push({ source: p[0].trim(), target: p[1].trim(), relation: p[2].trim() });
            });
            renderDataTable();
        }

        function renderDataTable() {
            const tbody = document.getElementById('data-table-body');
            tbody.innerHTML = currentData.map((row, i) => `<tr>
                <td>${row.source}</td><td>${row.target}</td><td>${row.relation}</td>
                <td style="color:red; cursor:pointer;" onclick="currentData.splice(${i},1);renderDataTable()">删除</td>
            </tr>`).join('');
        }

        function applyDataChanges() { updateGraphFromData(); alert("3D 视图已实时同步！"); }

        window.onload = init;
        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
