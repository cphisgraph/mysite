<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 知识图谱 VR 展示 - v1.2 Quest 交互修复版</title>
    <style>
        :root {
            --primary-color: #b38600;
            --ai-color: #1a73e8;
            --bg-light: #f5f5f7;
            --panel-bg: rgba(255, 255, 255, 0.96);
        }

        body { margin: 0; overflow: hidden; background-color: #000; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
        
        #nav-bar {
            position: absolute; top: 20px; right: 20px; z-index: 500;
            display: flex; gap: 10px; background: var(--panel-bg);
            padding: 5px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            backdrop-filter: blur(10px);
        }
        .nav-btn { padding: 8px 20px; border-radius: 8px; cursor: pointer; border: none; background: transparent; font-weight: bold; color: #666; transition: all 0.3s; }
        .nav-btn.active { background: var(--primary-color); color: white; }

        #viewport-container { width: 100%; height: 100vh; }

        /* 数据管理页面 */
        #data-table-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100vh;
            background: white; z-index: 400; display: none; overflow-y: auto;
            padding: 80px 40px 40px 40px; box-sizing: border-box;
        }

        .section-box { background: #fafafa; border: 1px solid #eee; border-radius: 16px; padding: 25px; margin-bottom: 30px; }
        textarea { width: 100%; height: 100px; margin-top: 10px; padding: 12px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 13px; }

        #detail-panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 360px; padding: 0; background: var(--panel-bg); backdrop-filter: blur(25px);
            border-radius: 28px; color: #1d1d1f; display: none; z-index: 1000; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.25);
        }
        .detail-header { padding: 40px 20px 20px 20px; text-align: center; }
        .node-avatar { width: 100px; height: 100px; border-radius: 50%; border: 3px solid white; margin-bottom: 10px; background: #eee; }
        .detail-body { padding: 0 25px 40px 25px; }
        .close-btn { position: absolute; top: 20px; right: 20px; width: 30px; height: 30px; cursor: pointer; font-size: 20px; text-align: center; line-height: 30px; background: rgba(0,0,0,0.05); border-radius: 50%; }

        .btn-action { background: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        #controls-hint { 
            position: absolute; bottom: 80px; width: 100%; text-align: center; 
            color: #fff; font-size: 12px; z-index: 10; pointer-events: none; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="nav-bar">
        <button class="nav-btn active" id="btn-show-3d">3D 图谱视图</button>
        <button class="nav-btn" id="btn-show-data">数据管理</button>
    </div>

    <div id="viewport-container"></div>

    <div id="data-table-container">
        <div class="section-box">
            <h2>✨ AI 提取与手动同步</h2>
            <textarea id="ai-input-text" placeholder="在此粘贴文本或 CSV 格式数据..."></textarea>
            <div style="margin-top: 10px;">
                <button class="btn-action" onclick="applyBatchImport()">解析并应用数据</button>
                <button class="btn-action" style="background:#eee; color:#666; margin-left:10px;" onclick="applyDataChanges()">💾 刷新图谱</button>
            </div>
        </div>
        <table id="data-table">
            <thead><tr><th>主节点</th><th>客节点</th><th>关系</th><th>操作</th></tr></thead>
            <tbody id="data-table-body"></tbody>
        </table>
    </div>

    <div id="detail-panel">
        <div class="close-btn" onclick="hideDetail()">×</div>
        <div class="detail-header">
            <img id="node-avatar" class="node-avatar" src="">
            <h2 id="panel-title" style="margin:0;">标题</h2>
        </div>
        <div class="detail-body">
            <p id="node-intro">实体信息加载中...</p>
            <div id="panel-relations"></div>
        </div>
    </div>

    <div id="controls-hint">VR 手柄操作：左摇杆平移移动 | 右摇杆旋转视角 | 扳机键点击节点</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- VR 按钮内置逻辑 ---
        const VRButton = {
            createButton: function ( renderer ) {
                const button = document.createElement( 'button' );
                function showEnterVR() {
                    let currentSession = null;
                    async function onSessionStarted( session ) {
                        session.addEventListener( 'end', onSessionEnded );
                        await renderer.xr.setSession( session );
                        button.textContent = '退出 VR';
                        currentSession = session;
                    }
                    function onSessionEnded() {
                        currentSession.removeEventListener( 'end', onSessionEnded );
                        button.textContent = '进入 VR 模式';
                        currentSession = null;
                    }
                    button.style.display = '';
                    button.style.cursor = 'pointer';
                    button.textContent = '进入 VR 模式';
                    button.onclick = () => {
                        if ( currentSession === null ) {
                            navigator.xr.requestSession( 'immersive-vr', { optionalFeatures: [ 'local-floor', 'bounded-floor', 'hand-tracking' ] } ).then( onSessionStarted );
                        } else {
                            currentSession.end();
                        }
                    };
                }
                function stylizeElement( element ) {
                    element.style.position = 'absolute';
                    element.style.bottom = '20px';
                    element.style.left = 'calc(50% - 75px)';
                    element.style.width = '150px';
                    element.style.padding = '12px 6px';
                    element.style.border = '1px solid #fff';
                    element.style.borderRadius = '8px';
                    element.style.background = 'rgba(0,0,0,0.8)';
                    element.style.color = '#fff';
                    element.style.font = 'bold 14px sans-serif';
                    element.style.textAlign = 'center';
                    element.style.zIndex = '9999';
                }
                if ( 'xr' in navigator ) {
                    stylizeElement( button );
                    navigator.xr.isSessionSupported( 'immersive-vr' ).then( ( supported ) => {
                        if(supported) showEnterVR();
                        else button.textContent = '您的设备不支持 VR';
                    } );
                    return button;
                } else {
                    const msg = document.createElement('div');
                    msg.innerHTML = "需 HTTPS 访问以开启 VR";
                    stylizeElement(msg);
                    return msg;
                }
            }
        };

        const COLORS = { person: 0xe63946, org: 0xf39c12, meeting: 0x2a9d8f, year: 0x457b9d, location: 0x9b5de5, other: 0x8d99ae };
        
        let currentData = [
            { source: "毛泽东", target: "1893年", relation: "出生年份" },
            { source: "毛泽东", target: "长沙市", relation: "出生地" },
            { source: "遵义会议", target: "1935年", relation: "发生年份" }
        ];

        let scene, camera, renderer, controls, raycaster;
        let graphGroup, worldRig;
        let interactableObjects = []; 
        let edgeObjects = [];
        
        // VR 导航参数
        const moveSpeed = 0.15;
        const rotateSpeed = 0.03;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);

            // worldRig 作为 VR 玩家的“底座”，移动它就相当于移动玩家
            worldRig = new THREE.Group();
            scene.add(worldRig);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            // 初始视角设在球体外部
            camera.position.set(0, 1.6, 40); 
            worldRig.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true;
            renderer.xr.setReferenceSpaceType('local');
            
            document.getElementById('viewport-container').appendChild(renderer.domElement);
            document.body.appendChild(VRButton.createButton(renderer));
            
            raycaster = new THREE.Raycaster();
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // 初始化图谱容器
            graphGroup = new THREE.Group();
            scene.add(graphGroup);

            initVRControllers();
            updateGraphFromData();
            initUI();

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const pointLight = new THREE.PointLight(0xffffff, 1);
            pointLight.position.set(20, 50, 30);
            scene.add(pointLight);

            // 增加星空背景
            const starGeo = new THREE.BufferGeometry();
            const starPos = [];
            for(let i=0; i<5000; i++) {
                starPos.push((Math.random()-0.5)*1000, (Math.random()-0.5)*1000, (Math.random()-0.5)*1000);
            }
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
            scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0x888888, size: 0.5})));

            renderer.setAnimationLoop(renderLoop);
        }

        function initVRControllers() {
            function onSelectStart() {
                // 将射线投射到场景中
                const tempMatrix = new THREE.Matrix4();
                tempMatrix.identity().extractRotation(this.matrixWorld);
                raycaster.ray.origin.setFromMatrixPosition(this.matrixWorld);
                raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

                const intersects = raycaster.intersectObjects(interactableObjects);
                if (intersects.length > 0) {
                    showDetail(intersects[0].object.userData.name);
                }
            }

            const c1 = renderer.xr.getController(0);
            c1.addEventListener('selectstart', onSelectStart);
            scene.add(c1);

            const c2 = renderer.xr.getController(1);
            c2.addEventListener('selectstart', onSelectStart);
            scene.add(c2);

            const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-5)]);
            const laserMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
            const laser = new THREE.Line(laserGeo, laserMat);
            c1.add(laser.clone());
            c2.add(laser.clone());
        }

        // --- 核心更新逻辑：确保连线精准连接 ---
        function updateGraphFromData() {
            while(graphGroup.children.length > 0) graphGroup.remove(graphGroup.children[0]);
            interactableObjects = [];
            edgeObjects = [];
            
            const nodesSet = new Set();
            currentData.forEach(d => { nodesSet.add(d.source); nodesSet.add(d.target); });
            const nodesArray = Array.from(nodesSet);
            const n = nodesArray.length;
            const radius = Math.max(15, Math.sqrt(n) * 4); 
            
            const nodeLookup = {};
            nodesArray.forEach((name, i) => {
                const phi = Math.acos(-1 + (2 * i) / n);
                const theta = Math.sqrt(n * Math.PI) * phi;
                const pos = new THREE.Vector3(
                    radius * Math.cos(theta) * Math.sin(phi),
                    radius * Math.sin(theta) * Math.sin(phi),
                    radius * Math.cos(phi)
                );
                nodeLookup[name] = createNode3D(name, pos);
            });

            currentData.forEach(rel => {
                if (nodeLookup[rel.source] && nodeLookup[rel.target]) {
                    createEdge3D(nodeLookup[rel.source], nodeLookup[rel.target], rel.relation);
                }
            });
        }

        function createNode3D(name, pos) {
            const category = /\d+年/.test(name) ? "year" : (/会议|大会|战役/.test(name) ? "meeting" : (name.length <= 3 ? "person" : "other"));
            const sphere = new THREE.Mesh(
                new THREE.SphereGeometry(category === "person" ? 0.8 : 0.5, 16, 16),
                new THREE.MeshPhongMaterial({ color: COLORS[category], emissive: COLORS[category], emissiveIntensity: 0.2 })
            );
            sphere.position.copy(pos);
            sphere.userData = { name, category };

            // 文本标签
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 256; canvas.height = 64;
            ctx.font = 'Bold 30px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
            ctx.fillText(name, 128, 45);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), depthTest: false }));
            sprite.position.set(0, 1.2, 0);
            sprite.scale.set(4, 1, 1);
            sphere.add(sprite);

            graphGroup.add(sphere);
            interactableObjects.push(sphere);
            return sphere;
        }

        function createEdge3D(startNode, endNode, label) {
            const geometry = new THREE.BufferGeometry();
            // 初始化两个点，稍后在 renderLoop 中实时更新
            const positions = new Float32Array(6); 
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const material = new THREE.LineBasicMaterial({ color: 0x555555, transparent: true, opacity: 0.4 });
            const line = new THREE.Line(geometry, material);
            
            graphGroup.add(line);
            edgeObjects.push({ line, startNode, endNode });
        }

        // --- 渲染循环与 VR 交互逻辑 ---
        function renderLoop() {
            const session = renderer.xr.getSession();
            
            // 处理 VR 摇杆移动
            if (session) {
                for (const source of session.inputSources) {
                    if (source.gamepad && source.gamepad.axes) {
                        const axes = source.gamepad.axes;
                        // 左手摇杆 (通常是 index 0/1) 控制移动
                        if (source.handedness === 'left') {
                            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                            forward.y = 0; right.y = 0; // 锁定水平面移动
                            worldRig.position.addScaledVector(forward, -axes[3] * moveSpeed);
                            worldRig.position.addScaledVector(right, axes[2] * moveSpeed);
                        }
                        // 右手摇杆 (通常是 index 2/3) 控制旋转
                        if (source.handedness === 'right') {
                            worldRig.rotation.y -= axes[2] * rotateSpeed;
                        }
                    }
                }
            } else {
                controls.update();
            }

            // 实时更新连线位置，确保它们始终锁定在节点中心
            edgeObjects.forEach(edge => {
                const posAttr = edge.line.geometry.attributes.position;
                // 注意：这里使用本地坐标，因为连线和节点都在 graphGroup 下
                posAttr.array[0] = edge.startNode.position.x;
                posAttr.array[1] = edge.startNode.position.y;
                posAttr.array[2] = edge.startNode.position.z;
                posAttr.array[3] = edge.endNode.position.x;
                posAttr.array[4] = edge.endNode.position.y;
                posAttr.array[5] = edge.endNode.position.z;
                posAttr.needsUpdate = true;
                edge.line.geometry.computeBoundingSphere(); // 必须重新计算包围球防止视锥体剔除
            });

            renderer.render(scene, camera);
        }

        // --- UI 及 数据处理 ---
        function initUI() {
            document.getElementById('btn-show-3d').onclick = () => {
                document.getElementById('viewport-container').style.display = 'block';
                document.getElementById('data-table-container').style.display = 'none';
                document.getElementById('btn-show-3d').classList.add('active');
                document.getElementById('btn-show-data').classList.remove('active');
            };
            document.getElementById('btn-show-data').onclick = () => {
                document.getElementById('viewport-container').style.display = 'none';
                document.getElementById('data-table-container').style.display = 'block';
                document.getElementById('btn-show-data').classList.add('active');
                document.getElementById('btn-show-3d').classList.remove('active');
                renderDataTable();
            };

            renderer.domElement.addEventListener('mousedown', (e) => {
                if(renderer.xr.isPresenting) return;
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(interactableObjects);
                if (intersects.length > 0) showDetail(intersects[0].object.userData.name);
                else hideDetail();
            });
        }

        function showDetail(name) {
            const node = interactableObjects.find(o => o.userData.name === name);
            document.getElementById('panel-title').innerText = name;
            document.getElementById('node-intro').innerText = `这是关于 ${name} 的百科关联信息。您可以通过 3D 射线探索其背后的知识网络。`;
            const rels = currentData.filter(d => d.source === name || d.target === name);
            document.getElementById('panel-relations').innerHTML = rels.map(r => 
                `<div class="relation-chip"><b>${r.relation}</b><span>${r.source === name ? '→ ' + r.target : '← ' + r.source}</span></div>`
            ).join('');
            document.getElementById('detail-panel').style.display = 'block';
        }

        function hideDetail() { document.getElementById('detail-panel').style.display = 'none'; }

        function applyBatchImport() {
            const text = document.getElementById('ai-input-text').value.trim();
            if(!text) return;
            const lines = text.split('\n');
            lines.forEach(line => {
                const p = line.split(',');
                if (p.length >= 3) currentData.push({ source: p[0].trim(), target: p[1].trim(), relation: p[2].trim() });
            });
            renderDataTable();
        }

        function renderDataTable() {
            const tbody = document.getElementById('data-table-body');
            tbody.innerHTML = currentData.map((row, i) => `<tr>
                <td>${row.source}</td><td>${row.target}</td><td>${row.relation}</td>
                <td style="color:red; cursor:pointer;" onclick="currentData.splice(${i},1);renderDataTable()">删除</td>
            </tr>`).join('');
        }

        function applyDataChanges() { updateGraphFromData(); alert("图谱已更新"); }

        window.onload = init;
        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
